name: Docker image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
      ACR_IMAGE: omnix/omnix-podstash
      ACR_USER: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
      ACR_PASS: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: echo "tag=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # ghcr 是兜底发布渠道，先推它；ACR 出错不影响下面的 ghcr + tar
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/plnoble/omnix-podstash:${{ steps.ver.outputs.tag }}
            ghcr.io/plnoble/omnix-podstash:latest
          provenance: false

      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/omnix-podstash/visibility \
            -f visibility=public

      - name: Export ARM64 tar for 极空间 import
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          tags: omnix-podstash:${{ steps.ver.outputs.tag }}
          outputs: type=docker,dest=/tmp/omnix-podstash-${{ steps.ver.outputs.tag }}-linux-arm64.tar
          provenance: false

      - name: Upload ARM64 tar to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.tag }}
          files: /tmp/omnix-podstash-${{ steps.ver.outputs.tag }}-linux-arm64.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 阿里云 ACR（可选渠道）：失败不影响 ghcr + tar，CI 不红。凭据修好后自动恢复推送。
      - name: Login to Aliyun ACR
        if: env.ACR_USER != '' && env.ACR_PASS != ''
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ env.ACR_USER }}
          password: ${{ env.ACR_PASS }}

      - name: Build and push Aliyun ACR
        if: env.ACR_USER != '' && env.ACR_PASS != ''
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_IMAGE }}:${{ steps.ver.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_IMAGE }}:latest
          provenance: false
