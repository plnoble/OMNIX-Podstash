version: "2"

# 极空间 T2S：不要让它去拉 ghcr.io（国内失败 + 包默认私有）。
# 正确顺序：
#   1. 从 GitHub Release 下载 omnix-podstash-0.3.0-linux-arm64.tar
#   2. 上传到极空间任意文件夹
#   3. Docker → 镜像 → 本地镜像 → 导入
#   4. 再粘贴本 YAML 创建项目
# volumes 用界面「查询路径」复制出来的目录，并先建好 podcasts、config 两个空文件夹。

services:
  podstash:
    image: omnix-podstash:0.3.0
    container_name: omnix-podstash
    restart: always
    ports:
      - "8765:8765"
    environment:
      - TZ=Asia/Shanghai
      - PODSTASH_HOST=0.0.0.0
      - PODSTASH_PORT=8765
      - PODSTASH_OUT_DIR=/podcasts
      - PODSTASH_CONFIG=/config
      - PODSTASH_CONCURRENCY=4
      - PODSTASH_NO_BROWSER=1
    volumes:
      - "/tmp/zfsv3/nvme11/13906165220/data/Docker/omnix-podstash/podcasts:/podcasts"
      - "/tmp/zfsv3/nvme11/13906165220/data/Docker/omnix-podstash/config:/config"
